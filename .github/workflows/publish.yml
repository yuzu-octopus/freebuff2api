name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile || true

      - name: Test
        run: bun test router/ || true

      # --- GitHub Packages (scoped name required) ---------------------------
      # GitHub Packages only supports scoped packages (@OWNER/NAME). The npmjs
      # publish uses the unscoped name; flip it here so this step targets the
      # GH registry, then restore for npmjs.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@yuzu-octopus'

      - name: Publish to GitHub Packages
        run: |
          npm pkg set name=@yuzu-octopus/freebuff2api
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- npmjs.org (unscoped name) ----------------------------------------
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Publish to npmjs
        run: |
          npm pkg set name=freebuff2api
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
